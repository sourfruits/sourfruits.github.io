<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourfruits</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon/android-chrome-512x512.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  
</head>
<body>
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <a class="back-link" href="index.html">&larr; All posts</a>

    <article id="post" class="post">
      <!-- Post content is injected here by js/post.js -->
    </article>
    <p id="status" class="status">Loading post…</p>
    <section id="related" class="related" aria-label="More like this" hidden>
      <h2 class="related-heading">More like this</h2>
      <div class="related-grid">
        <!-- Related post cards are injected here by js/post.js -->
      </div>
    </section>
    <nav id="post-nav" class="post-nav" aria-label="Post navigation">
      <!-- Previous/next links are injected here by js/post.js -->
    </nav>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> elia website</p>
  </footer>

  <!-- Markdown rendering (marked) + HTML sanitizing (DOMPurify) via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
