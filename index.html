<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourfruits</title>
  <meta name="description" content="A visual archive of taste and influence">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sourfruits">
  <meta property="og:title" content="Sourfruits">
  <meta property="og:description" content="A visual archive of taste and influence">
  <meta property="og:image" content="images/kafka-the-trial.jpg">
  <meta property="og:url" content="index.html">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="wide">
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <!-- Recent-posts carousel preview below the hero. The full grid (tag filter,
         density toggle, pagination) lives on posts.html; here it's a fixed
         filmstrip rendered by js/home.js, ending in a "See all posts →" card
         that links to posts.html. Carousel classes are hard-set so it's always
         a filmstrip (no in-page density switching). -->
    <div class="grid-wrap is-carousel" id="grid-wrap">
      <button type="button" class="carousel-arrow carousel-arrow-left" id="carousel-prev" aria-label="Scroll left">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <section id="grid" class="grid is-carousel" aria-label="Recent posts">
        <!-- Thumbnails are injected here by js/home.js -->
      </section>
      <button type="button" class="carousel-arrow carousel-arrow-right" id="carousel-next" aria-label="Scroll right">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
    <!-- Divider closing out the carousel, matching the hero divider's width. -->
    <hr class="hero-rule">
    <p id="status" class="status">Loading posts…</p>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Sourfruits</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
