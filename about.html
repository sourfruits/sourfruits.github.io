<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Sourfruits</title>
  <meta name="description" content="About Sourfruits.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <!-- Laid out like a post page (js/post.js): title, subtitle, rule, then the
         serif reading text, rendered from Markdown by js/about.js. -->
    <article class="post about-post">
      <h1 class="post-title">About elia website</h1>
      <p class="post-subtitle">an archive of what I’m reading, watching, and listening to</p>
      <hr class="post-rule">
      <div id="about-body" class="post-body"></div>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> elia website</p>
  </footer>

  <!-- Markdown rendering (marked) + HTML sanitizing (DOMPurify) via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
