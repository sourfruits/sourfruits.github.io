<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — elia website</title>
  <meta name="description" content="Essays, reportage, poems and other writing.">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon/android-chrome-512x512.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  
</head>
<body>
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <article class="writing">
      <h1 class="page-heading writing-heading">Writing</h1>
      <p class="precursors-intro writing-intro">Essays, poems, and reflections beyond the grid.</p>

      <!-- One tab per form (essay, poem… from data/tags.txt) on the left, as
           shortcuts into the "Tags" dropdown on the right. Driven by
           js/writing.js. -->
      <div class="writing-bar">
        <div class="form-tabs" id="form-tabs" role="group" aria-label="Filter by form" hidden></div>
        <div class="writing-bar-right">
        <div class="tag-filter" id="tag-filter">
          <button type="button" class="tag-dropdown-toggle" id="tag-dropdown-toggle" aria-haspopup="true" aria-expanded="false">
            <span class="tag-dropdown-label" id="tag-dropdown-label">Tags</span>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="tag-dropdown-menu" id="tag-dropdown-menu" role="group" aria-label="Filter by tag" hidden>
            <!-- Clear-all + subject checkboxes are injected here by js/writing.js -->
          </div>
        </div>
        <button type="button" class="drafts-toggle" id="drafts-toggle" aria-pressed="false" hidden>
          <svg class="drafts-icon drafts-icon-open" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="drafts-icon drafts-icon-closed" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <span class="drafts-label">Drafts</span>
        </button>
        </div>
      </div>

      <!-- Side index (computers): Form / Subject / Year, built by js/writing.js.
           Hidden on phones, where the bar above does the same job. -->
      <aside class="writing-index" id="writing-index" aria-label="Index"></aside>

      <!-- Year-grouped list of every post with "show: writing", injected by js/writing.js -->
      <div id="writing-list" class="writing-list"></div>
      <p id="status" class="status">Loading…</p>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> elia website</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/writing.js"></script>
</body>
</html>
