<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover so env(safe-area-inset-*) reports real values, letting
       the fullscreen graph controls dodge the notch / home indicator. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Precursors — Sourfruits</title>
  <meta name="description" content="A web of where things were discovered and how they connect.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="wide">
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <h1 class="precursors-title">Precursors<span class="beta-tag">beta</span></h1>
    <p class="precursors-intro">Not just what I've consumed, but where each piece came from and what I connect it to.</p>
    <!-- Meta line: "Updated <date> · Learn more". The date is filled by
         js/precursors.js from the GitHub API (last commit touching
         data/precursors.json); it stays hidden if the fetch fails. The
         learn-more cards live as a sibling AFTER the <details> so they wrap to
         their own full-width row below the line — CSS shows them only when the
         details is open. -->
    <div class="precursors-sub">
      <details class="precursors-learn">
        <summary class="precursors-learn-toggle">Learn more</summary>
      </details>
      <span class="precursors-updated" id="precursors-updated" hidden></span>
      <!-- Cards populated from LEARN_MORE_CARDS in js/precursors.js -->
      <div class="precursors-learn-cards" id="learn-more-cards"></div>
    </div>

    <hr class="precursors-rule">

    <div class="graph-area">
    <!-- Toolbar + graph together form the frame that goes full screen, so the
         mode toggle stays available in full screen too. -->
    <div class="graph-frame" id="graph-frame">
    <!-- Mode toggle + Threads filter in the toolbar above the graph. -->
    <div class="graph-toolbar">
      <div class="mode-toggle" role="group" aria-label="Graph mode">
        <button type="button" class="mode-btn" data-mode="discovery" aria-pressed="true">Discovery</button>
        <button type="button" class="mode-btn" data-mode="connections" aria-pressed="false">Connections</button>
      </div>
      <div class="thread-filter" id="thread-filter">
        <button type="button" class="tag-dropdown-toggle" id="thread-dropdown-toggle" aria-haspopup="true" aria-expanded="false">
          <span class="tag-dropdown-label" id="thread-dropdown-label">Threads</span>
          <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="thread-dropdown-menu" id="thread-dropdown-menu" role="group" aria-label="Highlight a thread" hidden></div>
      </div>
      <!-- Timeline scrubber toggle (Discovery only; hidden in Connections). -->
      <button type="button" class="graph-icon-btn timeline-btn" id="timeline-btn" aria-pressed="false" aria-label="Timeline" title="Timeline">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15 14"></polyline>
        </svg>
      </button>
      <!-- Tuning (dev tool) pinned to the top-right of the whole toolbar. -->
      <button type="button" class="graph-icon-btn tuning-toolbar-btn" id="graph-tuning-btn" aria-pressed="false" aria-label="Tuning" title="Tuning">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </button>
    </div>
    <div class="graph-wrap" id="graph-wrap">
      <!-- Timeline scrubber: floats on top of the graph when the clock is on
           (inset on the right so it clears the docked card + top-right controls).
           Steps through every month between the first and last discovery. -->
      <div class="timeline-row" id="timeline-row" hidden>
        <button type="button" class="timeline-play" id="timeline-play" aria-label="Play timeline" title="Play">
          <svg class="tl-play-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20"></polygon></svg>
          <svg class="tl-pause-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
        </button>
        <span class="timeline-year" id="timeline-min"></span>
        <div class="timeline-track" id="timeline-track">
          <div class="timeline-fill" id="timeline-fill"></div>
          <div class="timeline-thumb" id="timeline-thumb" role="slider" tabindex="0" aria-label="Timeline position"></div>
        </div>
        <span class="timeline-year" id="timeline-max"></span>
        <span class="timeline-current" id="timeline-current"></span>
      </div>
      <!-- Corner overlays: bottom-left legend, bottom-right reset + full-screen. -->
      <!-- Reset sits at the bottom-right, left of full-screen, so it stays
           visible at the bottom in full screen too. -->
      <button type="button" class="graph-icon-btn graph-reset-corner" id="graph-reset" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
      <button type="button" class="graph-fs-icon" id="graph-fs" aria-pressed="false" aria-label="Full screen" title="Full screen">
        <svg class="fs-icon fs-expand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <svg class="fs-icon fs-collapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      </button>
      <details class="graph-legend-card" open>
        <summary class="graph-legend-summary">Legend</summary>
        <div class="graph-legend" id="graph-legend" aria-hidden="true"></div>
      </details>
      <svg id="graph" aria-label="Force-directed graph of precursors"></svg>
      <!-- Docked node detail panel (right side); populated by js/precursors.js -->
      <div class="node-detail" id="node-detail"></div>
    </div>
    </div>

    <!-- Live tuning controls (troubleshooting); populated by js/precursors.js as
         three sections (Overall / Hub / Leaf) in a bar below the graph. -->
    <div class="tuning-panel" id="tuning-panel" hidden></div>
    </div>

    <p id="status" class="status">Loading graph…</p>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> elia website</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/precursors.js"></script>
</body>
</html>
