<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>elia website</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon/android-chrome-512x512.png">
  <link rel="manifest" href="images/favicon/site.webmanifest">
  
</head>
<body>
  <!-- Header markup is injected by js/header.js -->
  <header class="site-header"></header>

  <main>
    <a class="back-link" href="index.html">&larr; All posts</a>

    <!-- Title, description and list in one narrow column (post reading width). -->
    <div class="tag-page">
      <h1 id="tag-heading" class="tag-heading tag-page-title"></h1>
      <p id="tag-intro" class="precursors-intro tag-intro"></p>
      <hr class="tag-rule">

      <!-- Every published post with this tag, as compact text cards (no excerpt), injected by js/tag.js -->
      <ul id="tag-list" class="writing-grid is-compact" aria-label="Tagged posts"></ul>
      <p id="status" class="status">Loading posts…</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> elia website</p>
  </footer>

  <script src="js/utils.js"></script>
  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
    <script src="js/cards.js"></script>
  <script src="js/tag.js"></script>
</body>
</html>
