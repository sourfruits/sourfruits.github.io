name: Build data files

# Regenerate the data JSON the site reads from its hand-edited sources on every
# push to main, then commit it back:
#   data/posts/*.md    → data/posts.json      (scripts/build-posts.mjs)
#   data/precursors.txt → data/precursors.json (scripts/build-precursors.mjs)
# So adding/editing a post or a Precursors node is just editing the source and
# pushing; the JSON the site reads is always rebuilt automatically.

on:
  push:
    branches: [main]
    # Only run when something that affects the output changes.
    paths:
      - "data/posts/**"
      - "data/precursors.txt"
      - "scripts/build-posts.mjs"
      - "scripts/build-precursors.mjs"
      - ".github/workflows/build-posts.yml"

# Needed so the workflow's GITHUB_TOKEN can push the regenerated files back.
permissions:
  contents: write

# If several pushes land quickly, let a newer run supersede an in-flight one.
concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Each build fails the job (non-zero exit) if its source is malformed /
      # missing a required field, so a broken source never gets committed as
      # broken JSON.
      - name: Build posts.json
        run: node scripts/build-posts.mjs

      - name: Build precursors.json
        run: node scripts/build-precursors.mjs

      - name: Commit regenerated JSON (only if it changed)
        run: |
          if git diff --quiet -- data/posts.json data/precursors.json; then
            echo "data JSON already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/precursors.json
          git commit -m "chore: rebuild posts.json + precursors.json from sources [skip ci]"
          git push
